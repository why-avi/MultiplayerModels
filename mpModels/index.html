<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mpmodels</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
          <div class="sim-panel">
        <h2>Snapshot (Client/Server)</h2>
        <div class="canvas-label">Player 1 View</div>
        <canvas id="snapshotCanvas0" width="800" height="80"></canvas>
        <div class="canvas-label">Server View</div>
        <canvas id="serverCanvas" width="800" height="80"></canvas>
        <div class="canvas-label">Player 2 View</div>
        <canvas id="snapshotCanvas1" width="800" height="80"></canvas>
      </div>

      <div class="sim-panel">
        <h2>Lockstep (P2P)</h2>
        <div class="canvas-label">
          <p><b>Player 1 View</b> Controls: A and D<br> Latency = <input>ms</p>
          <canvas id="lockstepCanvas0" width="800" height="80"></canvas>
        </div>

        <div class="canvas-label">Player 2 View</div>
        <canvas id="lockstepCanvas1" width="800" height="80"></canvas>
      </div>
</html>
